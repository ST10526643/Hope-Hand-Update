<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry | HopeHands Foundation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span>HopeHands</span> Foundation</a>
    <nav class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="services.html">Services</a><a href="about.html">About</a><a href="enquiry.html" aria-current="page">Enquiry</a><a href="contact.html">Contact</a></nav>
  </header>
  <main class="page-content narrow-content">
    <h1>Enquiry</h1><p>Use this form if you would like to sponsor one of our projects or donate goods.</p>
    <form class="enquiry-form" action="#" method="post">
      <label for="name">Name</label><input id="name" name="Name" type="text" required>
      <label for="type">I am interested in</label><select id="type" name="Interest"><option>Sponsoring</option><option>Donating goods</option></select>
      <label for="message">Message</label><textarea id="message" name="Message" rows="5" required></textarea>
      <button type="submit">Send enquiry</button>
    </form>
  </main>
  <footer class="site-footer">HopeHands Foundation | South Africa</footer>
</body>
</html>
